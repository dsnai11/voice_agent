<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Recorder</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171f;--mute:#667085;--line:#e3e6ec;--acc:#2563eb;--rec:#dc2626;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--ink:#eef0f5;--mute:#98a1b3;--line:#2a303c;--acc:#5b8cff;--rec:#f05252;--ok:#34c26b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:var(--acc);width:0}
.script{font-size:clamp(26px,5vw,40px);line-height:1.5;font-weight:600;min-height:150px;padding:8px 0}
.tip{color:var(--mute);font-size:15px;margin-bottom:16px}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 16px}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 18px;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
button.big{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;min-width:170px}
button.big.rec{background:var(--rec);border-color:var(--rec)}
.status{margin-left:auto;color:var(--mute);font-size:14px}
.list{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;background:var(--card);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item.cur{border-color:var(--acc)}.item.done::before{content:"\2713 ";color:var(--ok);font-weight:700}
.hint{color:var(--mute);font-size:13px;margin-top:14px}
</style></head><body><div class="wrap">
<h1>Voice recorder</h1>
<p class="sub">Read the line on the screen in your natural phone voice. Recordings stay on this PC.</p>
<div class="card">
 <div class="top"><span id="pos">Line 1</span><span id="doneN"></span></div>
 <div class="bar"><i id="prog"></i></div>
 <div class="script" id="script">Loading…</div>
 <div class="tip" id="tip"></div>
 <div class="meter"><i id="lvl"></i></div>
 <div class="row">
  <button class="big" id="rec">Record (Space)</button>
  <button id="play" disabled>Play back</button>
  <button id="prev">Previous</button>
  <button id="next">Next</button>
  <span class="status" id="status"></span>
 </div>
 <div class="list" id="list"></div>
 <p class="hint">Press Space to start and stop. The take is saved when you stop; record again to replace it. Keep the phone or mic 15 to 20 cm away, in a quiet room.</p>
</div></div>
<script>
let L=[],done=new Set(),i=0,stream,mr,chunks=[],ctx,an,raf,recording=false,audioEl=null;
const $=id=>document.getElementById(id),st=t=>$("status").textContent=t;
async function load(){const r=await (await fetch("/lines")).json();L=r.lines;done=new Set(r.done);const f=L.findIndex(x=>!done.has(x.id));i=f<0?0:f;show();}
function show(){const l=L[i];$("script").textContent=l.text;$("tip").textContent="Tip: "+l.tip;$("pos").textContent=`Line ${i+1} of ${L.length}`;
 $("doneN").textContent=`${done.size} recorded`;$("prog").style.width=(done.size/L.length*100)+"%";$("play").disabled=!done.has(l.id);
 $("list").innerHTML="";L.forEach((x,k)=>{const d=document.createElement("div");d.className="item"+(k==i?" cur":"")+(done.has(x.id)?" done":"");d.textContent=x.text;d.onclick=()=>{if(!recording){i=k;show();}};$("list").appendChild(d);});}
async function start(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});}
 catch(e){st("Microphone blocked. Allow it in the browser address bar.");return;}
 ctx=new AudioContext();const src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
 chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=save;mr.start();recording=true;
 $("rec").textContent="Stop (Space)";$("rec").classList.add("rec");$("prev").disabled=$("next").disabled=true;st("Recording…");
 const buf=new Float32Array(an.fftSize);(function tick(){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;$("lvl").style.width=Math.min(100,Math.sqrt(s/buf.length)*400)+"%";raf=requestAnimationFrame(tick);})();}
function stop(){recording=false;cancelAnimationFrame(raf);$("lvl").style.width="0";mr.stop();stream.getTracks().forEach(t=>t.stop());
 $("rec").textContent="Record (Space)";$("rec").classList.remove("rec");$("prev").disabled=$("next").disabled=false;st("Saving…");}
function wav(buf){const x=buf.getChannelData(0),sr=buf.sampleRate,n=x.length,o=new DataView(new ArrayBuffer(44+n*2));
 const w=(p,s)=>[...s].forEach((c,k)=>o.setUint8(p+k,c.charCodeAt(0)));w(0,"RIFF");o.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);o.setUint32(24,sr,true);o.setUint32(28,sr*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,"data");o.setUint32(40,n*2,true);
 for(let k=0;k<n;k++){const v=Math.max(-1,Math.min(1,x[k]));o.setInt16(44+k*2,v<0?v*0x8000:v*0x7FFF,true);}return o.buffer;}
async function save(){try{const ab=await new Blob(chunks).arrayBuffer();const buf=await ctx.decodeAudioData(ab);ctx.close();
 if(buf.duration<1){st("Too short, please record again.");return;}
 const r=await fetch("/save/"+L[i].id,{method:"POST",body:wav(buf)});if(!r.ok)throw 0;done.add(L[i].id);show();st(`Saved (${buf.duration.toFixed(1)} s). Press Next or record again.`);}catch(e){st("Could not save. Is recorder.py still running?");}}
$("rec").onclick=()=>recording?stop():start();
$("play").onclick=()=>{if(audioEl)audioEl.pause();audioEl=new Audio(`/audio/${L[i].id}.wav?t=${Date.now()}`);audioEl.play();};
$("next").onclick=()=>{if(i<L.length-1){i++;show();st("");}};$("prev").onclick=()=>{if(i>0){i--;show();st("");}};
addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="BUTTON"){e.preventDefault();$("rec").click();}});
load();
</script></body></html>
